[package]
name = "mnemosyne"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mnemosyne"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Web Framework
axum = { version = "0.8", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors", "compression-gzip", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Auth
jsonwebtoken = "10.3"
bcrypt = "0.19"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# HTTP Client (for LiteLLM)
reqwest = { version = "0.12", features = ["json"] }

# Utils
glob = "0.3"
walkdir = "2.0"
clap = { version = "=4.6.5", features = ["derive", "env"] }
async-trait = "0.1"
futures = "0.3"
dotenvy = "0.15"
qdrant-client = "1.17.0"
pdf_oxide = "0.3"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
mockall = "0.15.0"

