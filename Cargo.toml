[package]
name = "mnemosyne"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP Client (for LiteLLM)
reqwest = { version = "0.12", features = ["json"] }

# Utils
glob = "0.3"
walkdir = "2.0"
clap = { version = "4.0", features = ["derive", "env"] }
async-trait = "0.1"
futures = "0.3"
dotenvy = "0.15"

# Document processing (Rust ecosystem is a bit sparse here, might use custom simple logic or external bins if needed)
# For now, let's focus on the structure.
